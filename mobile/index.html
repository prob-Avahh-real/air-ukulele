<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a2a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>空气尤克里里</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --lagoon: #0a2a2e;
      --deep: #06181b;
      --foam: #e8f4f1;
      --muted: #8fb3ad;
      --teak: #c47a3a;
      --teak-deep: #8a4f22;
      --gold: #e6c07a;
      --string: rgba(230, 192, 122, 0.55);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Sans SC", "Bricolage Grotesque", sans-serif;
      color: var(--foam);
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, rgba(196, 122, 58, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 100%, rgba(46, 120, 118, 0.35), transparent 50%),
        linear-gradient(165deg, #0d3338 0%, var(--lagoon) 40%, var(--deep) 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(12px + var(--safe-t)) 16px calc(16px + var(--safe-b));
      user-select: none;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand {
      font-family: "Bricolage Grotesque", "Noto Sans SC", sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 5vw, 1.75rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      animation: brandIn 0.7s ease-out both;
    }
    .brand span {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .badges { display: flex; flex-direction: column; gap: 6px; }
    .badge {
      font-size: 0.68rem;
      padding: 6px 10px;
      border: 1px solid rgba(143, 179, 173, 0.35);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(6, 24, 27, 0.45);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .badge.active {
      color: var(--gold);
      border-color: rgba(230, 192, 122, 0.55);
      background: rgba(196, 122, 58, 0.18);
    }

    .bank-tabs {
      display: flex;
      gap: 6px;
      margin: 10px 0 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .bank-tabs::-webkit-scrollbar { display: none; }
    .bank-tab {
      flex: 0 0 auto;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .bank-tab.active {
      color: var(--deep);
      background: var(--gold);
    }

    #stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
    }

    .chord-display {
      text-align: center;
      margin-bottom: 8px;
      z-index: 2;
      animation: rise 0.55s ease-out both;
    }
    .chord-display .bank {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .chord-display .name {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 18vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--foam);
      text-shadow: 0 8px 40px rgba(196, 122, 58, 0.35);
    }
    .chord-display .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .uke-wrap {
      position: relative;
      width: min(280px, 78vw);
      height: min(280px, 78vw);
      display: grid;
      place-items: center;
    }
    #ripple {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 2px solid rgba(230, 192, 122, 0.0);
      pointer-events: none;
    }
    #ripple.go {
      animation: rip 0.7s ease-out;
    }
    #uke {
      width: 78%;
      height: 78%;
      border-radius: 50% 50% 46% 46%;
      background:
        radial-gradient(circle at 50% 42%, #d9924f 0%, var(--teak) 42%, var(--teak-deep) 100%);
      box-shadow:
        inset 0 0 0 10px rgba(61, 32, 12, 0.35),
        inset 0 -20px 40px rgba(0, 0, 0, 0.25),
        0 20px 50px rgba(0, 0, 0, 0.35);
      position: relative;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease;
    }
    #uke::before {
      content: "";
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: var(--deep);
      box-shadow: 0 0 0 4px rgba(230, 192, 122, 0.35);
    }
    #uke .strings {
      position: absolute;
      inset: 12% 28%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      pointer-events: none;
    }
    #uke .strings i {
      display: block;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--string), transparent);
      transform-origin: center;
    }
    #uke.strumming {
      animation: strumKick 0.35s ease-out;
    }
    #uke.strumming .strings i {
      animation: stringVibe 0.45s ease-out;
    }
    #uke.strumming .strings i:nth-child(2) { animation-delay: 0.03s; }
    #uke.strumming .strings i:nth-child(3) { animation-delay: 0.06s; }
    #uke.strumming .strings i:nth-child(4) { animation-delay: 0.09s; }

    .chord-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 420px;
      margin: 14px auto 0;
    }
    .chord-btn {
      border: 1px solid rgba(143, 179, 173, 0.3);
      background: rgba(6, 24, 27, 0.4);
      color: var(--foam);
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 14px 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s, color 0.2s;
    }
    .chord-btn.active {
      background: linear-gradient(145deg, var(--teak), var(--teak-deep));
      border-color: transparent;
      color: #fff8ee;
      transform: translateY(-2px);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      max-width: 420px;
      align-self: center;
    }
    .controls button {
      border: none;
      font: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 16px 10px;
      border-radius: 16px;
      cursor: pointer;
      color: var(--foam);
      background: rgba(6, 24, 27, 0.55);
      border: 1px solid rgba(143, 179, 173, 0.28);
    }
    #strum-btn {
      background: linear-gradient(160deg, #e6c07a, #c47a3a);
      color: #2a1608;
      border: none;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }
    #mute-btn.on {
      color: #ffb4a8;
      border-color: rgba(255, 180, 168, 0.45);
    }

    .help {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--safe-b));
      transform: translateX(-50%) translateY(12px);
      background: rgba(6, 24, 27, 0.92);
      border: 1px solid rgba(230, 192, 122, 0.35);
      color: var(--gold);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 40;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes brandIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rip {
      0% { transform: scale(0.7); border-color: rgba(230, 192, 122, 0.55); opacity: 1; }
      100% { transform: scale(1.35); border-color: rgba(230, 192, 122, 0); opacity: 0; }
    }
    @keyframes strumKick {
      0% { transform: rotate(0deg) scale(1); }
      40% { transform: rotate(-2.5deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes stringVibe {
      0%, 100% { transform: scaleY(1); opacity: 0.55; }
      50% { transform: scaleY(1.8); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Watch / tiny screens */
    @media (max-width: 280px), (max-height: 300px) {
      body { padding: 6px; }
      .brand { font-size: 0.95rem; }
      .brand span, .help, .badges, #strum-up-btn, #mute-btn { display: none; }
      .bank-tabs { margin: 4px 0 6px; }
      .bank-tab { font-size: 0.65rem; padding: 4px 8px; }
      .chord-display .name { font-size: 2.2rem; }
      .chord-display .bank, .chord-display .hint { font-size: 0.55rem; }
      .uke-wrap { width: 100px; height: 100px; }
      .chord-grid { gap: 4px; margin-top: 6px; }
      .chord-btn { font-size: 0.75rem; padding: 8px 4px; border-radius: 8px; }
      .controls { grid-template-columns: 1fr; margin-top: 6px; }
      #strum-btn { padding: 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1 class="brand">空气尤克里里<span>Air Ukulele</span></h1>
    <div class="badges">
      <div class="badge" id="ring-badge">戒指 · 点击启用</div>
      <div class="badge" id="cane-badge">手杖 · 点击启用</div>
    </div>
  </header>

  <div class="bank-tabs" id="bank-tabs" aria-label="和弦组"></div>

  <main id="stage">
    <div class="chord-display">
      <div class="bank" id="bank-name">海岛</div>
      <div class="name" id="chord-name">C</div>
      <div class="hint" id="chord-hint">1 / 4</div>
    </div>

    <div class="uke-wrap" aria-hidden="true">
      <div id="ripple"></div>
      <div id="uke">
        <div class="strings"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>

    <div class="chord-grid" id="chord-grid"></div>
  </main>

  <div class="controls">
    <button type="button" id="strum-up-btn">上扫</button>
    <button type="button" id="strum-btn">扫弦</button>
    <button type="button" id="mute-btn">静音</button>
  </div>
  <p class="help">戒指选和弦 · 手杖挥动扫弦 · 敲击止音<br>琴身：轻点单弦拨响 · 左右滑扫弦 · 上下拖按弦滑音 · 键盘 1–4 单弦</p>

  <div id="toast" role="status"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
